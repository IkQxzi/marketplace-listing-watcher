[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-listing-watcher"
version = "0.1.0"
requires-python = ">=3.12" 

dependencies = [
    "beautifulsoup4",
    "pandas",
    "python-dotenv",
    "requests",
    "click",
    "jupyter",
    "ipykernel",
    "scipy>=1.18.0",
    "matplotlib>=3.11.1",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["src"]
