[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-listing-watcher"
version = "0.1.0"
requires-python = ">=3.12" 

dependencies = [
    "beautifulsoup4",
    "pandas",
    "python-dotenv",
    "google-genai",
    "requests",
    "click",
    "jupyter",
    "ipykernel",
    "scipy>=1.18.0",
    "matplotlib>=3.11.1",
    "pydantic",
]

[project.scripts]
update-refresh = "scripts.update_refresh_token:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
norecursedirs = ["experiments"]  # For scruffy tests
markers = [
    "api: marks tests as polling live API"
]


[tool.ruff]
target-version = "py314"

# 88 characters is the standard (matching Black).
line-length = 88

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.format]
# Standard layout settings
quote-style = "double"
indent-style = "space"
# Formats Python code snippets embedded in docstrings
docstring-code-format = true

[tool.ruff.lint]
# Selected rule sets:
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (unused imports, undefined variables)
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (auto-upgrades old syntax to modern Python)
    "B",      # flake8-bugbear (catches subtle bugs and design flaws)
    "SIM",    # flake8-simplify (suggests simpler, more readable Python idioms)
    "RUF",    # Ruff-specific rules
]

ignore = [
    # Handled automatically by the formatter, so we disable the linter warning
    "E501",   # line-too-long
]

[tool.ruff.lint.isort]
# Combines `from foo import a, b` onto one line if they fit
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Ignore `B008` (function call in default argument) for FastAPI/Pydantic dependencies
# e.g., `def get_item(token: str = Depends(...)):` or `Field(...)`
"**/*" = ["B008"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
