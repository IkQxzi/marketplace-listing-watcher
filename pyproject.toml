[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ebaymk2"
version = "0.1.0"
requires-python = ">=3.12" 

dependencies = [
    "playwright==1.59.0",
    "camoufox",
    "beautifulsoup4",
    "curl_cffi",
    "pandas",
    "python-dotenv",
    "requests",
    "camoufox[geoip]",
    "click",
    "jupyter",
    "ipykernel",
    "scipy>=1.18.0",
    "matplotlib>=3.11.1",
]

[tool.setuptools.packages.find]
where = ["src"]